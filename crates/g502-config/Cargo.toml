[package]
name = "g502-config"
description = "Readonly desktop viewer for Logitech G502 mice"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "g502_config"
path = "src/lib.rs"

[[bin]]
name = "g502-config"
path = "src/main.rs"

[dependencies]
lg-snapshot.workspace = true
clap.workspace = true
gpui-kit = "0.11.0"

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
